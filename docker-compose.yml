services:
  backend:
    build: ./backend
    container_name: student-backend
    ports:
      - "5001:5000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-https://example.supabase.co}
      SUPABASE_KEY: ${SUPABASE_KEY:-placeholder}
      PORT: 5000
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    container_name: student-frontend
    ports:
      - "8082:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped