
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Management System</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #f3f4f6;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #243b55;
        }

        h2 {
            color: #243b55;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: 10px 14px;
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .submit-btn {
            grid-column: span 2;
            background: #2563eb;
        }

        .edit-btn {
            background: #059669;
            margin-bottom: 4px;
        }

        .delete-btn {
            background: #dc2626;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            min-width: 750px;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #243b55;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        #message {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }

        .success {
            color: #166534;
            background: #dcfce7;
        }

        .error {
            color: #991b1b;
            background: #fee2e2;
        }

        @media (max-width: 650px) {
            body {
                padding: 10px;
            }

            form {
                grid-template-columns: 1fr;
            }

            .submit-btn {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Management System</h1>

    <h2>Add / Update Student</h2>

    <form id="studentForm">

        <input type="hidden" id="id">

        <input
            type="text"
            id="student_id"
            placeholder="Student ID"
            required
        >

        <input
            type="text"
            id="full_name"
            placeholder="Full Name"
            required
        >

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <input
            type="text"
            id="phone"
            placeholder="Phone Number"
            required
        >

        <input
            type="text"
            id="course"
            placeholder="Course"
            required
        >

        <button type="submit" class="submit-btn" id="saveButton">
            Save Student
        </button>

    </form>

    <p id="message"></p>

    <h2>Student Records</h2>

    <button type="button" onclick="loadStudents()">
        Refresh Records
    </button>

    <div class="table-container">

        <table>
            <thead>
                <tr>
                    <th>Database ID</th>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Course</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="studentList">
                <tr>
                    <td colspan="7">Loading students...</td>
                </tr>
            </tbody>

        </table>

    </div>

</div>

<script>

    // Backend API URL
     const API_URL = "http://127.0.0.1:5001/api/students";

    const form = document.getElementById("studentForm");
    const message = document.getElementById("message");
    const studentList = document.getElementById("studentList");

    // Display messages
    function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
    }

    // Load all students
    async function loadStudents() {

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Unable to load student records");
            }

            const students = await response.json();

            studentList.innerHTML = "";

            if (students.length === 0) {
                studentList.innerHTML = `
                    <tr>
                        <td colspan="7">No student records found.</td>
                    </tr>
                `;
                return;
            }

            students.forEach(student => {

                const row = document.createElement("tr");

                const values = [
                    student.id,
                    student.student_id,
                    student.full_name,
                    student.email,
                    student.phone,
                    student.course
                ];

                values.forEach(value => {
                    const cell = document.createElement("td");
                    cell.textContent = value ?? "";
                    row.appendChild(cell);
                });

                const actions = document.createElement("td");

                const editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.className = "edit-btn";
                editButton.onclick = () => editStudent(student.id);

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete-btn";
                deleteButton.onclick = () => deleteStudent(student.id);

                actions.appendChild(editButton);
                actions.appendChild(deleteButton);

                row.appendChild(actions);

                studentList.appendChild(row);

            });

        } catch (error) {

            studentList.innerHTML = `
                <tr>
                    <td colspan="7">Unable to connect to backend.</td>
                </tr>
            `;

            showMessage(error.message, "error");
        }
    }

    // Add or Update Student
    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const id = document.getElementById("id").value;

        const student = {

            student_id: document.getElementById("student_id").value.trim(),

            full_name: document.getElementById("full_name").value.trim(),

            email: document.getElementById("email").value.trim(),

            phone: document.getElementById("phone").value.trim(),

            course: document.getElementById("course").value.trim()

        };

        try {

            const response = await fetch(
                id ? `${API_URL}/${id}` : API_URL,
                {
                    method: id ? "PUT" : "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(student)
                }
            );

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Operation failed");
            }

            showMessage(
                id
                    ? "Student updated successfully!"
                    : "Student added successfully!",
                "success"
            );

            form.reset();

            document.getElementById("id").value = "";

            document.getElementById("saveButton").textContent =
                "Save Student";

            await loadStudents();

        } catch (error) {

            showMessage(error.message, "error");

        }

    });

    // Edit Student
    async function editStudent(id) {

        try {

            const response = await fetch(API_URL);

            const students = await response.json();

            const student = students.find(item => item.id === id);

            if (!student) {
                throw new Error("Student not found");
            }

            document.getElementById("id").value = student.id;

            document.getElementById("student_id").value =
                student.student_id;

            document.getElementById("full_name").value =
                student.full_name;

            document.getElementById("email").value =
                student.email;

            document.getElementById("phone").value =
                student.phone;

            document.getElementById("course").value =
                student.course;

            document.getElementById("saveButton").textContent =
                "Update Student";

            showMessage("Editing student record.", "success");

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        } catch (error) {

            showMessage(error.message, "error");

        }

    }

    // Delete Student
    async function deleteStudent(id) {

        const confirmed = confirm(
            "Are you sure you want to delete this student?"
        );

        if (!confirmed) return;

        try {

            const response = await fetch(`${API_URL}/${id}`, {
                method: "DELETE"
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || "Delete failed");
            }

            showMessage(
                "Student deleted successfully!",
                "success"
            );

            await loadStudents();

        } catch (error) {

            showMessage(error.message, "error");

        }

    }

    // Load records when page opens
    loadStudents();

</script>

</body>
</html>
